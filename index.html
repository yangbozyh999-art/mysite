<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>笨者 · 加密货币交易员</title>
<style>
  :root {
    --bg: #07080f;
    --panel: rgba(255, 255, 255, 0.04);
    --border: rgba(255, 255, 255, 0.08);
    --text: #e8eaf2;
    --muted: #8a90a5;
    --cyan: #00e5ff;
    --purple: #8b5cf6;
    --pink: #ff2e97;
    --grad: linear-gradient(120deg, var(--cyan), var(--purple) 55%, var(--pink));
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "SF Mono", "JetBrains Mono", Consolas, "Microsoft YaHei", monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
  }
  /* ---- background ---- */
  .grid-bg {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background-image:
      linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size: 48px 48px;
    mask-image: radial-gradient(ellipse 80% 65% at 50% 35%, #000 40%, transparent 100%);
    -webkit-mask-image: radial-gradient(ellipse 80% 65% at 50% 35%, #000 40%, transparent 100%);
  }
  .orb {
    position: fixed; border-radius: 50%; filter: blur(120px); opacity: .35; z-index: 0;
    pointer-events: none; animation: drift 18s ease-in-out infinite alternate;
  }
  .orb-1 { width: 480px; height: 480px; background: var(--purple); top: -140px; left: -110px; }
  .orb-2 { width: 400px; height: 400px; background: var(--cyan); bottom: -120px; right: -100px; animation-delay: -6s; }
  .orb-3 { width: 300px; height: 300px; background: var(--pink); top: 35%; left: 62%; opacity: .16; animation-delay: -12s; }
  @keyframes drift {
    from { transform: translate(0, 0) scale(1); }
    to   { transform: translate(60px, 40px) scale(1.15); }
  }

  .wrap { position: relative; z-index: 1; width: 100%; max-width: 760px; margin: 0 auto; padding: 0 24px; flex: 1; display: flex; flex-direction: column; justify-content: center; }

  /* ---- hero ---- */
  .hero { padding: 88px 0 56px; text-align: center; }

  .avatar-ring {
    width: 168px; height: 168px; margin: 0 auto 36px; position: relative;
    border-radius: 50%;
    padding: 3px;
    background: var(--grad);
    box-shadow: 0 0 46px rgba(139, 92, 246, .45);
    animation: float 6s ease-in-out infinite;
  }
  .avatar-ring::after {
    content: ""; position: absolute; inset: -14px; border-radius: 50%;
    border: 1px dashed rgba(0, 229, 255, .25);
    animation: spin 22s linear infinite;
  }
  .avatar-ring img {
    width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: block;
    background: #0c0d16; border: 3px solid var(--bg);
  }
  @keyframes float { 50% { transform: translateY(-8px); } }
  @keyframes spin { to { transform: rotate(360deg); } }

  .status-chip {
    display: inline-flex; align-items: center; gap: 8px;
    border: 1px solid var(--border); border-radius: 999px;
    padding: 6px 16px; font-size: 12px; color: var(--muted);
    background: var(--panel); margin-bottom: 28px;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 8px #22c55e; animation: pulse 2s infinite; }
  @keyframes pulse { 50% { opacity: .35; } }

  h1 { font-size: clamp(44px, 9vw, 76px); line-height: 1.08; letter-spacing: 4px; }
  h1 .grad { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }

  .role {
    margin-top: 20px; font-size: 15px; letter-spacing: 3px; color: var(--muted);
  }
  .role .typing { color: var(--cyan); }
  .role .typing::after { content: "▌"; animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  .divider {
    width: 160px; height: 1px; margin: 46px auto;
    background: linear-gradient(90deg, transparent, var(--purple), var(--cyan), transparent);
    opacity: .7;
  }

  /* ---- contact ---- */
  .contact-label { font-size: 11px; letter-spacing: 5px; color: var(--cyan); margin-bottom: 22px; text-align: center; }
  .contact-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px; }
  .contact-item {
    display: flex; align-items: center; gap: 14px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
    padding: 17px 20px; text-decoration: none; color: var(--text);
    transition: border-color .25s, transform .25s, box-shadow .25s, background .25s;
    backdrop-filter: blur(8px);
  }
  .contact-item:hover {
    border-color: rgba(0, 229, 255, .55);
    transform: translateY(-3px);
    box-shadow: 0 10px 30px rgba(0, 229, 255, .12);
    background: rgba(255, 255, 255, 0.06);
  }
  .contact-item .ci-icon {
    width: 38px; height: 38px; flex: 0 0 38px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; background: rgba(255,255,255,0.05); border: 1px solid var(--border);
  }
  .contact-item .ci-text { min-width: 0; text-align: left; }
  .contact-item .ci-title { font-size: 13px; letter-spacing: 1px; }
  .contact-item small { display: block; color: var(--muted); font-size: 12px; margin-top: 4px; word-break: break-all; }

  footer {
    position: relative; z-index: 1;
    padding: 34px 0 40px; text-align: center; color: var(--muted); font-size: 11px; letter-spacing: 1px;
    border-top: 1px solid var(--border); margin-top: 48px;
  }
  footer .heart { color: var(--pink); }

  .fade { opacity: 0; transform: translateY(18px); animation: rise .9s cubic-bezier(.22,1,.36,1) forwards; }
  .d1 { animation-delay: .05s; } .d2 { animation-delay: .18s; } .d3 { animation-delay: .32s; } .d4 { animation-delay: .46s; }
  @keyframes rise { to { opacity: 1; transform: none; } }

  @media (max-width: 560px) {
    .avatar-ring { width: 138px; height: 138px; }
    .hero { padding: 64px 0 40px; }
    h1 { letter-spacing: 2px; }
    .contact-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="grid-bg"></div>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="orb orb-3"></div>

<div class="wrap">
  <header class="hero">
    <div class="avatar-ring fade d1">
      <img src="avatar.png" alt="笨者的头像">
    </div>

    <div class="status-chip fade d1"><span class="dot"></span> ONLINE · 24/7 盯盘</div>

    <h1 class="fade d2"><span class="grad">笨 者</span></h1>

    <p class="role fade d3"><span class="typing" id="typing"></span></p>

    <div class="divider fade d3"></div>

    <div class="fade d4">
      <div class="contact-label">// CONTACT</div>
      <div class="contact-grid">
        <a class="contact-item" href="mailto:benzhe888@gmail.com">
          <span class="ci-icon">✉️</span>
          <span class="ci-text">
            <span class="ci-title">Email</span>
            <small>benzhe888@gmail.com</small>
          </span>
        </a>
        <a class="contact-item" href="https://t.me/Benzhe888" target="_blank" rel="noopener">
          <span class="ci-icon">✈️</span>
          <span class="ci-text">
            <span class="ci-title">Telegram</span>
            <small>@Benzhe888</small>
          </span>
        </a>
        <a class="contact-item" href="https://x.com/Lizhizuodiyi" target="_blank" rel="noopener">
          <span class="ci-icon">𝕏</span>
          <span class="ci-text">
            <span class="ci-title">Twitter / X</span>
            <small>@Lizhizuodiyi</small>
          </span>
        </a>
      </div>
    </div>
  </header>
</div>

<footer>
  <p>© 2026 笨者 · 加密货币交易员 · <span class="heart">♥</span> Not financial advice</p>
</footer>

<script>
  const phrases = ["加密货币交易员", "CRYPTO TRADER"];
  const el = document.getElementById("typing");
  let pi = 0, ci = 0, deleting = false;
  function tick() {
    const p = phrases[pi];
    el.textContent = p.slice(0, ci);
    if (!deleting) {
      if (ci < p.length) { ci++; setTimeout(tick, 110); }
      else { deleting = true; setTimeout(tick, 2200); }
    } else {
      if (ci > 0) { ci--; setTimeout(tick, 45); }
      else { deleting = false; pi = (pi + 1) % phrases.length; setTimeout(tick, 400); }
    }
  }
  tick();
</script>
</body>
</html>
